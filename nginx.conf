server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml;

    location = /scoops-yard-service/privacy { return 301 /privacy.html; }
    location = /scoops-yard-service/terms { return 301 /terms.html; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
